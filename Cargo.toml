[package]
name = "tome"
version = "0.1.13"
edition = "2021"
description = "A docs reader for humans and AI — browse Confluence, GitHub, and local docs from your terminal"
license = "MIT"
repository = "https://github.com/sumsar01/tome"

[[bin]]
name = "tome"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Config / secrets
dirs = "5"
keyring = { version = "3", features = ["apple-native"] }

# TUI
ratatui = "0.30"
crossterm = "0.28"

# Markdown rendering
pulldown-cmark = "0.13"

# Syntax highlighting for code blocks
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# File system
walkdir = "2"
notify = "6"

# Search
fuzzy-matcher = "0.3"

# Database (doc registry + FTS5 full-text search)
rusqlite = { version = "0.39", features = ["bundled"] }

# Clipboard
arboard = "3"

# MCP
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# Time (for cache TTL)
chrono = { version = "0.4", features = ["serde"] }

# Password input (hidden)
rpassword = "7"

# Base64 decoding (GitHub API responses)
base64 = "0.22"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
